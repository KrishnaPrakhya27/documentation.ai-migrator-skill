# GitBook (Git Sync Liquid Markdown / API markdown) → Documentation.AI.
platform: gitbook
version: 1
rules:
  - id: gitbook/hint
    tier: T2
    match: { name: hint }
    to: { name: Callout, props: { kind: $map(style) } }
    note: "style info|success|warning|danger → contract valueMaps (warning→alert)"
  - id: gitbook/tabs
    tier: T3
    match: { name: tabs }
    handler: tabs
  - id: gitbook/tab
    tier: T1
    match: { name: tab }
    to: { name: Tab, props: { title: $title } }
  - id: gitbook/details
    tier: T1
    match: { name: details }
    # `open` is how the source states that the disclosure starts expanded; Documentation.AI spells
    # the same thing `defaultOpen`. Dropping it would have closed a block the author left open.
    to: { name: Expandable, props: { title: $summary, defaultOpen: $open } }
  - id: gitbook/embed
    tier: T3
    match: { name: embed }
    handler: embed-to-iframe-or-link
    note: "a URL whose host is not allowlisted for iframes (a GitHub repository, say) stays a link"
  - id: gitbook/content-ref
    tier: T4
    match: { name: content-ref }
    children: unwrap
    note: "content-ref becomes a plain link paragraph (children carry the link)"
  - id: gitbook/stepper
    tier: T3
    match: { name: stepper }
    handler: list-to-steps
  - id: gitbook/step
    tier: T3
    match: { name: step }
    handler: step-title-from-heading
    note: "GitBook steps carry no title; the leading heading becomes the required Step title"
  - id: gitbook/cards
    tier: T3
    match: { name: cards }
    handler: cards-to-columns
    note: "a card table (<table data-view=\"cards\">) the Markdown adapter reads into cards; data-card-size is presentation"
  - id: gitbook/card
    tier: T2
    match: { name: card }
    to: { name: Card, props: { title: $title, href: $href, icon: $icon, image: $image } }
    note: "href is the card target column, image the cover column, icon the Font Awesome name without fa-"
  - id: gitbook/columns
    tier: T4
    match: { name: columns }
    children: unwrap
    note: "Documentation.AI has no per-column container; the columns' content is kept in reading order"
  - id: gitbook/column
    tier: T4
    match: { name: column }
    children: unwrap
    drop: [width, valign]
  - id: gitbook/updates
    tier: T4
    match: { name: updates }
    children: unwrap
    drop: [format]
  - id: gitbook/update
    tier: T2
    match: { name: update }
    to: { name: Update, props: { label: $date } }
    drop: [tags]
    note: "Update.tags is an array, which the MDX contract cannot express as a literal prop; the tags are recorded as dropped"
  - id: gitbook/ask-button
    tier: T7
    match: { name: button, props: { data-action: ask } }
    children: drop
    note: "GitBook Assistant prompt: it works only inside GitBook, so verify treats it as platform chrome like script and style"
  - id: gitbook/search-button
    tier: T7
    match: { name: button, props: { data-action: search } }
    children: drop
    note: "GitBook search prompt: it opens GitBook's own search, so verify treats it as platform chrome like the assistant button"
  - id: gitbook/api-param
    tier: T2
    match: { name: api-param }
    to: { name: ParamField, props: { path: $path, query: $query, header: $header, body: $body, param-type: $param-type, required: $required, deprecated: $deprecated, enum: $enum } }
    note: "an operation parameter or request-body field the Markdown adapter read from GitBook's OpenAPI fence"
  - id: gitbook/api-field
    tier: T2
    match: { name: api-field }
    to: { name: ResponseField, props: { name: $name, field-type: $field-type, required: $required, deprecated: $deprecated, enum: $enum } }
    note: "a response or models-page schema field read from GitBook's OpenAPI fence"
  - id: gitbook/api-properties
    tier: T1
    match: { name: api-properties }
    to: { name: Expandable, props: { title: $title } }
    note: "the nested properties of an object or array field, as Documentation.AI's generated API pages show them"
  - id: gitbook/prompt
    tier: T3
    match: { name: prompt }
    handler: prompt-to-code
    note: "a copyable prompt: its description is the caption the reader sees, its text is the code they copy; the 'open in AI provider' actions are GitBook's and are recorded as not carried"
  - id: gitbook/file
    tier: T2
    match: { name: file }
    to: { name: Card, props: { href: $src } }
    note: "a file the reader downloads: the block's text is the card's, and the file's address is its link. A file served by the source site is a link this migration does not rewrite, so it is listed with the unmigrated links"
  - id: gitbook/br
    tier: T4
    match: { name: br }
    children: drop
    note: "a bare line break between blocks is spacing the blocks already have; verify treats it as chrome like script and style"
  - id: gitbook/mdx-esm
    tier: T2
    match: { name: esm }
    children: drop
    note: "import/export statements are module syntax, never page content, and never reach the output"
