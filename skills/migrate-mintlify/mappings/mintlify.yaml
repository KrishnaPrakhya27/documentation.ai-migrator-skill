# Mintlify → Documentation.AI. Near 1:1 MDX with a rename layer.
platform: mintlify
version: 1
rules:
  - id: mint/note
    tier: T1
    match: { name: Note }
    to: { name: Callout, props: { kind: info } }
  - id: mint/tip
    tier: T1
    match: { name: Tip }
    to: { name: Callout, props: { kind: tip } }
  - id: mint/warning
    tier: T1
    match: { name: Warning }
    to: { name: Callout, props: { kind: alert } }
  - id: mint/info
    tier: T1
    match: { name: Info }
    to: { name: Callout, props: { kind: info } }
  - id: mint/check
    tier: T1
    match: { name: Check }
    to: { name: Callout, props: { kind: success } }
  - id: mint/accordion
    tier: T2
    match: { name: Accordion }
    to: { name: Expandable, props: { title: $title } }
    drop: [icon, defaultOpen]
  - id: mint/accordion-group
    tier: T1
    match: { name: AccordionGroup }
    to: { name: ExpandableGroup }
  - id: mint/card-group
    tier: T2
    match: { name: CardGroup }
    # the authored cols is kept and clamped only when outside the contract enum [2,3,4]; an absent cols renders the shared default
    handler: cards-to-columns
  - id: mint/card
    tier: T2
    match: { name: Card }
    to: { name: Card, props: { title: $title, href: $href, icon: $icon, image: $img, cta: $cta, horizontal: $horizontal } }
    # icon colour, icon style and the hover arrow are decoration; any other authored prop is reported as dropped
    drop: [color, iconType, arrow]
  - id: mint/frame
    tier: T4
    match: { name: Frame }
    handler: frame-to-image
  - id: mint/video
    tier: T2
    match: { name: video }
    # src is rewritten through the asset manifest before conversion; data-path is the asset's repository path, carried by the manifest
    to: { name: Video, props: { src: $src, controls: $controls, autoplay: $autoplay, loop: $loop, muted: $muted, poster: $poster } }
    drop: [data-path]
  - id: mint/tabs
    tier: T3
    match: { name: Tabs }
    handler: tabs
  - id: mint/tab
    tier: T1
    match: { name: Tab }
    to: { name: Tab, props: { title: $title } }
  - id: mint/steps
    tier: T1
    match: { name: Steps }
    to: { name: Steps }
  - id: mint/step
    tier: T2
    match: { name: Step }
    to: { name: Step, props: { title: $title, icon: $icon } }
  - id: mint/code-group
    tier: T1
    match: { name: CodeGroup }
    to: { name: CodeGroup }
  - id: mint/tooltip
    tier: T4
    match: { name: Tooltip }
    handler: tooltip-to-abbr
  - id: mint/badge
    tier: T4
    match: { name: Badge }
    handler: badge-to-span
  - id: mint/request-example
    tier: T1
    match: { name: RequestExample }
    to: { name: Request }
  - id: mint/response-example
    tier: T1
    match: { name: ResponseExample }
    to: { name: Response }
  - id: mint/param-field
    tier: T1
    match: { name: ParamField }
    to: { name: ParamField, props: { name: $name, type: $type, required: $required } }
  - id: mint/response-field
    tier: T1
    match: { name: ResponseField }
    to: { name: ResponseField, props: { name: $name, type: $type, required: $required } }
  - id: mint/update
    tier: T1
    match: { name: Update }
    to: { name: Update, props: { label: $label, description: $description } }
  - id: mint/video
    tier: T2
    match: { name: video }
    # a published <video> keeps its HTML media attributes; src and poster are rehosted through the asset manifest
    to: { name: Video, props: { src: $src, poster: $poster, controls: $controls, autoplay: $autoplay, loop: $loop, muted: $muted } }
    # data-path is the storage path Mintlify stamps on published media; the rehosted src carries the file
    drop: [data-path]
