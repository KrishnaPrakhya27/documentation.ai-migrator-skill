# Generic HTML → Documentation.AI. Applies to every platform after its own table.
platform: "*"
version: 1
rules:
  - id: generic/details-expandable
    tier: T1
    match: { name: details }
    to: { name: Expandable, props: { title: $summary } }
  - id: generic/admonition-callout
    tier: T1
    match: { name: admonition }
    to: { name: Callout, props: { kind: $map(kind) } }
    note: "a themed aside (.note, .callout, .warning, .tip) is a callout; its class suffix names the kind through the contract value map"
  - id: generic/madcap-dropdown-expandable
    tier: T1
    match: { name: MCDropDown }
    to: { name: Expandable, props: { title: $title } }
    note: "MadCap Flare collapsible section; the head's label titles the Expandable and the body becomes its content"
  - id: generic/card-group
    tier: T2
    match: { name: CardGroup }
    handler: cards-to-columns
    note: "a grid of cards a profile recognised (MadCap Flare landing-page tiles); the profile states the columns the skin draws"
  - id: generic/card
    tier: T2
    match: { name: Card }
    to: { name: Card, props: { title: $title, href: $href, icon: $icon, image: $image } }
    note: "a tile: its label is the card's title and its target its link"
  - id: generic/madcap-linked-toc
    tier: T3
    match: { name: MCLinkedToc }
    handler: linked-toc-to-list
    note: "MadCap Flare tile menu drawn from a linked table of contents; written as the list of links the reader sees, from the data discovery froze"
  - id: generic/iframe
    tier: T3
    match: { name: iframe }
    handler: embed-to-iframe
  - id: generic/video
    tier: T2
    match: { name: video }
    # the HTML media attributes are content; src and poster are rehosted through the asset manifest
    to: { name: Video, props: { src: $src, poster: $poster, controls: $controls, autoplay: $autoplay, loop: $loop, muted: $muted } }
  - id: generic/script-drop
    tier: T7
    match: { name: script }
    children: drop
    note: "scripts never survive; the subtree is recorded as excluded by rule"
  - id: generic/style-drop
    tier: T7
    match: { name: style }
    children: drop
